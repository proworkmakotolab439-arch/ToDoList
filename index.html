<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Team ToDo - チームタスク管理</title>
  
  <!-- キャッシュ制御 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- PWA設定 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TeamToDo">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            slate: {
              750: '#293548',
              850: '#151e2e',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- カスタムスタイル -->
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ローディングプログレスバー -->
  <div id="loading-bar" class="fixed top-0 left-0 right-0 h-1 bg-indigo-100 dark:bg-slate-800 overflow-hidden z-50 hidden">
    <div class="h-full bg-indigo-600 animate-loading w-1/3"></div>
  </div>

  <!-- アプリメインラッパー（最大幅をスマホサイズに制限して中央配置） -->
  <div id="app-container" class="w-full max-w-md mx-auto flex-1 flex flex-col bg-white dark:bg-slate-850 shadow-2xl relative min-h-screen">
    
    <!-- 1. トップバー / ヘッダー -->
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-850/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-3 py-2.5 safe-top flex items-center justify-between gap-1.5">
      <!-- ログイン中ユーザー表示 & 担当絞り込みセレクター -->
      <div class="flex items-center gap-1.5 flex-1 min-w-0">
        <!-- ログインユーザーバッジ -->
        <div id="header-user-badge" class="flex items-center gap-1 px-2.5 py-1.5 bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200/60 dark:border-indigo-800/60 rounded-xl text-xs font-bold text-indigo-700 dark:text-indigo-300 truncate shadow-2xs">
          <span id="header-user-icon">👤</span>
          <span id="header-user-name" class="truncate">ログイン中</span>
        </div>

        <!-- 全員タスク表示時の担当絞り込み（adminや全体閲覧用） -->
        <select id="user-select" class="bg-slate-100 dark:bg-slate-800 border-none text-[11px] font-semibold rounded-xl px-2 py-1.5 focus:ring-2 focus:ring-indigo-500 text-slate-700 dark:text-slate-300 cursor-pointer hidden">
          <!-- JSで自動生成 -->
        </select>
      </div>

      <!-- ビュー切替トグル（リスト / カレンダー） -->
      <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-lg shrink-0">
        <button id="view-list-btn" class="p-1.5 rounded-md bg-white dark:bg-slate-700 shadow-2xs text-indigo-600 dark:text-indigo-400" title="リスト表示">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
        </button>
        <button id="view-cal-btn" class="p-1.5 rounded-md text-slate-500 dark:text-slate-400" title="カレンダー表示">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </button>
      </div>

      <!-- パスワード変更ボタン（一般ユーザー用） -->
      <button id="change-password-btn" class="p-1.5 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0" title="パスワード変更">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
      </button>

      <!-- 管理者設定ボタン（adminのみ表示） -->
      <button id="settings-btn" class="p-1.5 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0 hidden" title="管理者設定">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>

      <!-- ログアウトボタン（常時表示で一目で分かる） -->
      <button id="header-logout-btn" class="flex items-center gap-1 px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 active:scale-95 dark:bg-rose-950/50 dark:hover:bg-rose-900/70 text-rose-600 dark:text-rose-400 rounded-xl text-xs font-bold transition-all shrink-0 border border-rose-200/60 dark:border-rose-800/60 shadow-2xs" title="ログアウト">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span>ログアウト</span>
      </button>
    </header>

    <!-- 2. 全員 / 個人 切替タブ -->
    <div class="flex border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-850 px-3">
      <button id="tab-all" class="flex-1 py-2 text-xs font-bold text-center border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 transition-colors">
        全員タスク
      </button>
      <button id="tab-personal" class="flex-1 py-2 text-xs font-medium text-center text-slate-500 hover:text-slate-700 dark:text-slate-400 transition-colors">
        個人タスク（非公開）
      </button>
    </div>

    <!-- 3. メインコンテンツ領域 -->
    <main class="flex-1 p-4 overflow-y-auto no-scrollbar pb-24">
      
      <!-- (A) リストビュー表示時 -->
      <section id="list-view-section">
        <!-- 絞り込み & ソートツールバー -->
        <div class="flex items-center gap-2 mb-3 overflow-x-auto no-scrollbar py-0.5">
          <select id="status-filter" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-lg px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500">
            <option value="incomplete">未完了のみ</option>
            <option value="all">すべて表示</option>
            <option value="past">⏰ 過去のタスク (期限切れ・履歴)</option>
            <option value="completed">完了済みのみ</option>
          </select>

          <select id="category-filter" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-lg px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500">
            <!-- JSで動的生成 -->
          </select>

          <select id="sort-filter" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-lg px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500 ml-auto">
            <option value="due_date_asc">期限が近い順</option>
            <option value="due_date_desc">期限が遠い順</option>
            <option value="priority">優先度順</option>
          </select>
        </div>

        <div class="flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 mb-2 px-1">
          <span id="task-list-title-label">タスク一覧</span>
          <span id="task-count-badge" class="font-semibold text-slate-500 dark:text-slate-400">0件</span>
        </div>

        <!-- タスクリスト一覧 -->
        <div id="task-list" class="space-y-2.5">
          <!-- JSで動的生成 -->
        </div>
      </section>

      <!-- (B) カレンダービュー表示時 -->
      <section id="cal-view-section" class="hidden">
        <div id="calendar-container"></div>

        <!-- カレンダーで選択した日のタスク一覧 -->
        <div class="mt-4">
          <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-1 mb-2 px-1">
            <span id="cal-selected-date-label" class="text-xs font-bold text-slate-700 dark:text-slate-200">
              選択日のタスク
            </span>
          </div>
          <div id="cal-day-tasks-list" class="space-y-2.5">
            <!-- JSで動的生成 -->
          </div>
        </div>
      </section>

    </main>

    <!-- 4. フローティングアクションボタン (FAB) -->
    <div class="fixed bottom-6 right-6 md:right-[calc(50%-224px+24px)] z-40 safe-bottom">
      <button id="fab-add-task" class="w-14 h-14 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-full shadow-lg shadow-indigo-500/40 flex items-center justify-center transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-300" title="タスクを追加">
        <svg class="w-6 h-6 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>

    <!-- =====================================================================
         モーダル郡
         ===================================================================== -->

    <!-- (1) ユーザー＆パスワード ログインモーダル -->
    <div id="passcode-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-100 dark:border-slate-700">
        <div class="w-14 h-14 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 mx-auto flex items-center justify-center mb-3">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
        <h2 class="text-lg font-bold text-center text-slate-800 dark:text-white mb-1">ログイン</h2>
        <p class="text-xs text-center text-slate-400 mb-5">ユーザー名とパスワードを入力してください</p>

        <!-- ユーザー名入力（手入力） -->
        <div class="mb-3.5 text-left">
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">ユーザー名</label>
          <div class="relative">
            <input type="text" id="login-user-input" placeholder="ユーザー名を入力" maxlength="20" class="w-full px-3 py-2.5 bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-semibold text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500" autocomplete="username">
          </div>
        </div>

        <!-- パスワード入力 -->
        <div class="mb-4 text-left">
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">パスワード</label>
          <div class="relative">
            <input type="password" id="passcode-input" placeholder="パスワードを入力" class="w-full px-3 py-2.5 bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white pr-10" autocomplete="current-password">
            <button type="button" id="toggle-password-visibility" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <p id="passcode-error" class="text-xs text-rose-500 font-semibold mb-3 text-center hidden">ユーザー名またはパスワードが一致しません</p>

        <button id="passcode-submit-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-md shadow-indigo-500/20">
          ログインする
        </button>

        <!-- 新規ユーザー登録へのリンクボタン -->
        <button id="open-register-btn" type="button" class="w-full py-2.5 mt-3 text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 bg-indigo-50 dark:bg-indigo-950/40 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 rounded-xl transition-colors">
          初めての方はこちら（新規ユーザー登録）
        </button>
      </div>
    </div>

    <!-- (1-B) 新規ユーザー登録モーダル -->
    <div id="register-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-100 dark:border-slate-700">
        <div class="w-14 h-14 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 mx-auto flex items-center justify-center mb-3">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
        </div>
        <h2 class="text-lg font-bold text-center text-slate-800 dark:text-white mb-1">新規ユーザー登録</h2>
        <p class="text-xs text-center text-slate-400 mb-5">お名前と専用のパスワードを設定してください</p>

        <!-- 登録ユーザー名 -->
        <div class="mb-3.5 text-left">
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">お名前（ユーザー名） <span class="text-rose-500">*</span></label>
          <input type="text" id="register-name-input" placeholder="例: 佐藤" maxlength="20" class="w-full px-3 py-2.5 bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-semibold text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- 登録パスワード -->
        <div class="mb-3.5 text-left">
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">パスワード（4文字以上） <span class="text-rose-500">*</span></label>
          <input type="password" id="register-pass-input" placeholder="パスワードを入力" maxlength="20" class="w-full px-3 py-2.5 bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
        </div>

        <!-- パスワード確認 -->
        <div class="mb-4 text-left">
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">パスワード（確認） <span class="text-rose-500">*</span></label>
          <input type="password" id="register-pass-confirm-input" placeholder="もう一度入力" maxlength="20" class="w-full px-3 py-2.5 bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
        </div>

        <p id="register-error" class="text-xs text-rose-500 font-semibold mb-3 text-center hidden"></p>

        <button id="register-submit-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-md shadow-indigo-500/20">
          登録してログイン
        </button>

        <button id="close-register-btn" type="button" class="w-full py-2.5 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 text-xs font-semibold mt-2 transition-colors">
          ログイン画面に戻る
        </button>
      </div>
    </div>

    <!-- (2) タスク登録・編集モーダル -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center hidden">
      <div class="bg-white dark:bg-slate-850 rounded-t-3xl sm:rounded-3xl p-5 w-full max-w-md shadow-2xl border-t sm:border border-slate-200 dark:border-slate-700 max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-4">
          <h2 id="task-modal-title" class="font-bold text-slate-800 dark:text-white text-base">新しいタスク</h2>
          <button id="close-task-modal" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <form id="task-form" class="space-y-3.5 overflow-y-auto pr-1 flex-1">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">タスク名 <span class="text-rose-500">*</span></label>
            <input type="text" id="task-title" required placeholder="例: 定例スライド作成" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">詳細メモ</label>
            <textarea id="task-desc" rows="2" placeholder="詳細やURLなど" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white"></textarea>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">期限日時</label>
              <input type="datetime-local" id="task-due-date" class="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">担当者</label>
              <select id="task-assignee" class="w-full px-2.5 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
                <!-- JS生成 -->
              </select>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">共有範囲</label>
              <select id="task-scope" class="w-full px-2 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
                <option value="all">全員共有</option>
                <option value="personal">個人タスク</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">優先度</label>
              <select id="task-priority" class="w-full px-2 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
                <option value="high">高</option>
                <option value="medium" selected>中</option>
                <option value="low">低</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">カテゴリ</label>
              <select id="task-category" class="w-full px-2 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
                <!-- JS生成 -->
              </select>
            </div>
          </div>

          <div class="pt-3 flex items-center justify-between gap-3 border-t border-slate-100 dark:border-slate-800 mt-4">
            <button type="button" id="delete-task-btn" class="px-3 py-2 text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-xl text-xs font-semibold hidden">

            <div class="flex items-center gap-2 ml-auto">
              <button type="submit" id="save-task-btn" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-indigo-500/20 transition-all">
                保存
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- (3) アプリ設定モーダル（管理者 admin 専用） -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white dark:bg-slate-850 rounded-3xl p-5 w-full max-w-sm shadow-2xl border border-slate-200 dark:border-slate-700 max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-3">
          <div class="flex items-center gap-2">
            <span class="text-base font-bold text-slate-800 dark:text-white">管理者設定</span>
            <span class="px-2 py-0.5 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 text-[10px] font-bold rounded-full">admin</span>
          </div>
          <button id="close-settings-btn" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="space-y-4 overflow-y-auto pr-1 flex-1">
          <!-- 管理者(admin)のパスワード変更 -->
          <div class="p-3 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border border-slate-200/80 dark:border-slate-700">
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-200 mb-1">管理者(admin)のパスワード</label>
            <input type="text" id="admin-passcode-input" class="w-full px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-xl text-xs font-mono">
            <span class="text-[10px] text-slate-400">adminでログインする際のパスワード（初期値: bell）</span>
          </div>

          <!-- チームメンバー管理（名前＋パスワード） -->
          <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">チームメンバー & 個別パスワード</span>
              <span id="member-count-label" class="text-[10px] text-slate-400"></span>
            </div>
            <p class="text-[10px] text-slate-400 mb-2">メンバー名と個別のログインパスワードを設定・管理できます。</p>
            
            <!-- メンバー一覧リスト -->
            <div id="members-list-container" class="space-y-2 max-h-44 overflow-y-auto pr-1 mb-2">
              <!-- JSで動的生成 -->
            </div>

            <!-- 新規メンバー追加フォーム -->
            <div class="p-2.5 bg-slate-50 dark:bg-slate-800/60 rounded-xl border border-dashed border-slate-300 dark:border-slate-700 space-y-1.5">
              <div class="flex items-center gap-1.5">
                <input type="text" id="new-member-input" placeholder="メンバー名 (例: 山田)" maxlength="20" class="flex-1 px-2.5 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-xl text-xs">
                <input type="text" id="new-member-pass-input" placeholder="PW (初期: bell)" maxlength="20" class="w-24 px-2 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-xl text-xs font-mono">
              </div>
              <button type="button" id="add-member-btn" class="w-full py-1.5 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/60 text-indigo-600 dark:text-indigo-300 text-xs font-bold rounded-xl transition-colors">
                ＋ メンバーを追加
              </button>
            </div>
          </div>

          <!-- カテゴリー管理 -->
          <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">カテゴリー管理</span>
              <span id="category-count-label" class="text-[10px] text-slate-400"></span>
            </div>
            
            <!-- カテゴリー一覧リスト -->
            <div id="categories-list-container" class="space-y-1.5 max-h-36 overflow-y-auto pr-1 mb-2">
              <!-- JSで動的生成 -->
            </div>

            <!-- 新規カテゴリー追加フォーム -->
            <div class="flex items-center gap-1.5 mt-2">
              <input type="text" id="new-category-input" placeholder="新しいカテゴリー名" maxlength="20" class="flex-1 px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs">
              <button type="button" id="add-category-btn" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition-colors">
                ＋追加
              </button>
            </div>
          </div>
        </div>

        <div class="pt-3 border-t border-slate-100 dark:border-slate-800 shrink-0">
          <button id="save-settings-btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-indigo-500/20">

          <button id="logout-btn" type="button" class="w-full py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-semibold mt-2 transition-colors">

    </div>

    <!-- (4) 個人パスワード変更モーダル（一般ユーザー用） -->
    <div id="user-password-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white dark:bg-slate-850 rounded-3xl p-5 w-full max-w-xs shadow-2xl border border-slate-200 dark:border-slate-700">

        <div class="space-y-3">

          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">新しいパスワード</label>
            <input type="password" id="new-personal-pass-input" placeholder="4文字以上で入力" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
          </div>
          <button id="save-personal-pass-btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-indigo-500/20">
            変更を保存

        </div>
      </div>

    <!-- (5) 確認ダイアログ (削除時などのPoka-yoke) -->
    <div id="confirm-dialog" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[70] flex items-center justify-center p-4 hidden">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 w-full max-w-xs shadow-2xl border border-slate-200 dark:border-slate-700 text-center">
        <div class="w-10 h-10 rounded-full bg-rose-100 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 mx-auto flex items-center justify-center mb-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <p id="confirm-message" class="text-xs text-slate-700 dark:text-slate-200 mb-4 font-medium leading-relaxed"></p>
        <div class="flex items-center justify-center gap-2">
          <button id="confirm-cancel-btn" class="flex-1 py-2 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">

          <button id="confirm-ok-btn" class="flex-1 py-2 text-xs font-semibold text-white bg-rose-600 hover:bg-rose-700 rounded-lg shadow-sm">

  <!-- スクリプトの読み込み（最新版を強制読み込み） -->
  <script src="./js/config.js?v=6"></script>
  <script src="./js/db.js?v=6"></script>
  <script src="./js/calendar.js?v=6"></script>
  <script src="./js/app.js?v=6"></script>

  <!-- PWA Service Worker 登録 & キャッシュ即時更新 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=6').then((reg) => {
          // 起動時に最新のService Workerを強制チェック
          reg.update();
          reg.addEventListener('updatefound', () => {
            const installingWorker = reg.installing;
            if (installingWorker) {
              installingWorker.addEventListener('statechange', () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // 新しいSWがインストールされたら直ちに適用してリロード
                  installingWorker.postMessage({ action: 'skipWaiting' });
                }
              });
            }
          });
        }).catch(err => console.log('SW登録スキップ/エラー:', err));

        // 新しいSWが制御を開始したら1度だけ自動リロード
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>
