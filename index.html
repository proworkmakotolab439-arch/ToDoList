<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Team ToDo - チームタスク管理</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TeamToDo">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            slate: {
              750: '#293548',
              850: '#151e2e',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- カスタムスタイル -->
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ローディングプログレスバー -->
  <div id="loading-bar" class="fixed top-0 left-0 right-0 h-1 bg-indigo-100 dark:bg-slate-800 overflow-hidden z-50 hidden">
    <div class="h-full bg-indigo-600 animate-loading w-1/3"></div>
  </div>

  <!-- アプリメインラッパー（最大幅をスマホサイズに制限して中央配置） -->
  <div id="app-container" class="w-full max-w-md mx-auto flex-1 flex flex-col bg-white dark:bg-slate-850 shadow-2xl relative min-h-screen">
    
    <!-- 1. トップバー / ヘッダー -->
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-850/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-2.5 safe-top flex items-center justify-between gap-2">
      <!-- ユーザー選択ドロップダウン -->
      <div class="flex items-center gap-2 flex-1">
        <select id="user-select" class="bg-slate-100 dark:bg-slate-800 border-none text-xs font-bold rounded-xl px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500 text-slate-700 dark:text-slate-200 cursor-pointer">
          <!-- JSで自動生成 -->
        </select>
      </div>

      <!-- ビュー切替トグル（リスト / カレンダー） -->
      <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
        <button id="view-list-btn" class="p-1.5 rounded-md bg-white dark:bg-slate-700 shadow-xs text-indigo-600 dark:text-indigo-400" title="リスト表示">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
        </button>
        <button id="view-cal-btn" class="p-1.5 rounded-md text-slate-500 dark:text-slate-400" title="カレンダー表示">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </button>
      </div>

      <!-- 設定（Supabase/合言葉）ボタン -->
      <button id="settings-btn" class="p-1.5 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" title="設定">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>
    </header>

    <!-- 2. 全員 / 個人 切替タブ -->
    <div class="flex border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-850 px-3">
      <button id="tab-all" class="flex-1 py-2 text-xs font-bold text-center border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 transition-colors">
        全員タスク
      </button>
      <button id="tab-personal" class="flex-1 py-2 text-xs font-medium text-center text-slate-500 hover:text-slate-700 dark:text-slate-400 transition-colors">
        個人タスク
      </button>
    </div>

    <!-- 3. メインコンテンツ領域 -->
    <main class="flex-1 p-4 overflow-y-auto no-scrollbar pb-24">
      
      <!-- (A) リストビュー表示時 -->
      <section id="list-view-section">
        <!-- 絞り込み & ソートツールバー -->
        <div class="flex items-center gap-2 mb-3 overflow-x-auto no-scrollbar py-0.5">
          <select id="status-filter" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-lg px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500">
            <option value="incomplete">未完了のみ</option>
            <option value="all">すべて表示</option>
            <option value="past">⏰ 過去のタスク (期限切れ・履歴)</option>
            <option value="completed">完了済みのみ</option>
          </select>

          <select id="category-filter" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-lg px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500">
            <!-- JSで動的生成 -->
          </select>

          <select id="sort-filter" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-lg px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500 ml-auto">
            <option value="due_date_asc">期限が近い順</option>
            <option value="due_date_desc">期限が遠い順</option>
            <option value="priority">優先度順</option>
          </select>
        </div>

        <div class="flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 mb-2 px-1">
          <span>タスク一覧</span>
          <span id="task-count-badge" class="font-semibold text-slate-500 dark:text-slate-400">0件</span>
        </div>

        <!-- タスクリスト一覧 -->
        <div id="task-list" class="space-y-2.5">
          <!-- JSで動的生成 -->
        </div>
      </section>

      <!-- (B) カレンダービュー表示時 -->
      <section id="cal-view-section" class="hidden">
        <div id="calendar-container"></div>

        <!-- カレンダーで選択した日のタスク一覧 -->
        <div class="mt-4">
          <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-1 mb-2 px-1">
            <span id="cal-selected-date-label" class="text-xs font-bold text-slate-700 dark:text-slate-200">
              選択日のタスク
            </span>
          </div>
          <div id="cal-day-tasks-list" class="space-y-2.5">
            <!-- JSで動的生成 -->
          </div>
        </div>
      </section>

    </main>

    <!-- 4. フローティングアクションボタン (FAB) -->
    <div class="fixed bottom-6 right-6 md:right-[calc(50%-224px+24px)] z-40 safe-bottom">
      <button id="fab-add-task" class="w-14 h-14 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-full shadow-lg shadow-indigo-500/40 flex items-center justify-center transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-300" title="タスクを追加">
        <svg class="w-6 h-6 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>

    <!-- =====================================================================
         モーダル郡
         ===================================================================== -->

    <!-- (1) 合言葉認証モーダル -->
    <div id="passcode-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center border border-slate-100 dark:border-slate-700">
        <div class="w-14 h-14 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 mx-auto flex items-center justify-center mb-4">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h2 class="text-lg font-bold text-slate-800 dark:text-white mb-5">合言葉を入力</h2>

        <input type="password" id="passcode-input" placeholder="合言葉を入力" class="w-full text-center tracking-widest text-xl font-bold bg-slate-100 dark:bg-slate-700 border-none rounded-xl py-3 mb-2 focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
        
        <p id="passcode-error" class="text-xs text-rose-500 font-semibold mb-4 hidden">合言葉が一致しません</p>

        <button id="passcode-submit-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-md shadow-indigo-500/20">
          ログイン
        </button>
      </div>
    </div>

    <!-- (2) タスク登録・編集モーダル -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center hidden">
      <div class="bg-white dark:bg-slate-850 rounded-t-3xl sm:rounded-3xl p-5 w-full max-w-md shadow-2xl border-t sm:border border-slate-200 dark:border-slate-700 max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-4">
          <h2 id="task-modal-title" class="font-bold text-slate-800 dark:text-white text-base">新しいタスク</h2>
          <button id="close-task-modal" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <form id="task-form" class="space-y-3.5 overflow-y-auto pr-1 flex-1">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">タスク名 <span class="text-rose-500">*</span></label>
            <input type="text" id="task-title" required placeholder="例: 定例スライド作成" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">詳細メモ</label>
            <textarea id="task-desc" rows="2" placeholder="詳細やURLなど" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white"></textarea>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">期限日時</label>
              <input type="datetime-local" id="task-due-date" class="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">担当者</label>
              <select id="task-assignee" class="w-full px-2.5 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
                <!-- JS生成 -->
              </select>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">共有範囲</label>
              <select id="task-scope" class="w-full px-2 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
                <option value="all">全員共有</option>
                <option value="personal">個人タスク</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">優先度</label>
              <select id="task-priority" class="w-full px-2 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
                <option value="high">高</option>
                <option value="medium" selected>中</option>
                <option value="low">低</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">カテゴリ</label>
              <select id="task-category" class="w-full px-2 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white">
                <!-- JS生成 -->
              </select>
            </div>
          </div>

          <div class="pt-3 flex items-center justify-between gap-3 border-t border-slate-100 dark:border-slate-800 mt-4">
            <button type="button" id="delete-task-btn" class="px-3 py-2 text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-xl text-xs font-semibold hidden">
              削除
            </button>
            <div class="flex items-center gap-2 ml-auto">
              <button type="submit" id="save-task-btn" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-indigo-500/20 transition-all">
                保存
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- (3) アプリ設定モーダル（Supabase設定 & 合言葉変更） -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white dark:bg-slate-850 rounded-3xl p-5 w-full max-w-sm shadow-2xl border border-slate-200 dark:border-slate-700">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-4">
          <h2 class="font-bold text-slate-800 dark:text-white text-base">アプリ設定</h2>
          <button id="close-settings-btn" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">チーム合言葉 (パスコード)</label>
            <input type="text" id="custom-passcode-input" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono">
            <span class="text-[10px] text-slate-400">アプリ起動時に求めるチーム合言葉</span>
          </div>

          <!-- チームメンバー設定 -->
          <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">チームメンバー管理</span>
              <span id="member-count-label" class="text-[10px] text-slate-400"></span>
            </div>
            <p class="text-[10px] text-slate-400 mb-2">名前の変更や追加・削除が可能です（「全員」はシステム共通）。</p>
            
            <!-- メンバー一覧リスト -->
            <div id="members-list-container" class="space-y-1.5 max-h-36 overflow-y-auto pr-1 mb-2">
              <!-- JSで動的生成 -->
            </div>

            <!-- 新規メンバー追加フォーム -->
            <div class="flex items-center gap-1.5 mt-2">
              <input type="text" id="new-member-input" placeholder="新しいメンバー名" maxlength="20" class="flex-1 px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs">
              <button type="button" id="add-member-btn" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition-colors">
                ＋追加
              </button>
            </div>
          </div>

          <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
            <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 block mb-2">Supabase 接続設定</span>
            <div class="space-y-2">
              <div>
                <label class="block text-[11px] font-medium text-slate-500 mb-1">Project URL</label>
                <input type="text" id="supabase-url-input" placeholder="https://xxxx.supabase.co" class="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono">
              </div>
              <div>
                <label class="block text-[11px] font-medium text-slate-500 mb-1">Anon API Key</label>
                <input type="password" id="supabase-key-input" placeholder="eyJhbGciOi..." class="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono">
              </div>
            </div>
            <p class="text-[10px] text-slate-400 mt-1">※未入力の場合は端末ローカルのモックデータで動作します。</p>
          </div>

          <button id="save-settings-btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold mt-4 shadow-md shadow-indigo-500/20">
            設定を保存
          </button>
        </div>
      </div>
    </div>

    <!-- (4) 確認ダイアログ (削除時などのPoka-yoke) -->
    <div id="confirm-dialog" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 w-full max-w-xs shadow-2xl border border-slate-200 dark:border-slate-700 text-center">
        <div class="w-10 h-10 rounded-full bg-rose-100 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 mx-auto flex items-center justify-center mb-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <p id="confirm-message" class="text-xs text-slate-700 dark:text-slate-200 mb-4 font-medium leading-relaxed"></p>
        <div class="flex items-center justify-center gap-2">
          <button id="confirm-cancel-btn" class="flex-1 py-2 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">
            キャンセル
          </button>
          <button id="confirm-ok-btn" class="flex-1 py-2 text-xs font-semibold text-white bg-rose-600 hover:bg-rose-700 rounded-lg shadow-sm">
            削除する
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- スクリプトの読み込み -->
  <script src="./js/config.js?v=3"></script>
  <script src="./js/db.js?v=3"></script>
  <script src="./js/calendar.js?v=3"></script>
  <script src="./js/app.js?v=3"></script>

  <!-- PWA Service Worker 登録 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW登録スキップ/エラー:', err));
      });
    }
  </script>
</body>
</html>
